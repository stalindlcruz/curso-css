<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        background-color: aliceblue;
      }

      .parent {
        display: flex;
        /* flex-direction: row; */
        /* flex-wrap: nowrap; */
        /* flex-wrap: wrap; */
        flex-flow: row nowrap;
        border: 4px solid #000;
        width: 200px;
        /* flex-direction: row; */
        /* flex-direction: row-reverse; */
        /* flex-direction: column; */
        /* flex-direction: column-reverse; */
        /* direction: rtl; */
        /* writing-mode: vertical-lr; */

        .item {
          box-sizing: border-box;
          border: 1px solid;
          opacity: 0.9;
          /* width: 200px; */
          height: 100px;
          background-color: #09f;
          cursor: pointer;

          /* flex: auto; */

          /* valores por defecto */
          flex-grow: 1; /* Los elementos CRECEN. */
          flex-shrink: 1; /* Los elementos pueden reducir su tamaño a un tamaño mas pequeño que su flex-basis */
          flex-basis: 0; /* Los elementos tienen un tamaño base en auto */

          flex: 1;
        }

        .item:first-child {
          background-color: yellow;
        }

        .item:nth-child(2) {
          background-color: rgba(58, 255, 114, 0.779);
        }

        .item:last-child {
          background-color: red;
        }
      }
    </style>
  </head>
  <body>
    <section class="parent">
      <div class="item">priemro</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </section>
  </body>
</html>
