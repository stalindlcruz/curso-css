      span {
        background-color: cadetblue;
      }

      .containerII {
        width: 160px;
        height: 160px;
        padding: 7px;
        margin: 16px;
        border: 3px solid red;
        background-color: white;
        /* box-sizing: content-box; --> por defecto */
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        /* overflow: scroll; */
        overflow: auto; /* recomendado! */
        /* overflow: hidden;
        text-overflow: ellipsis; */
      }

      body {
        background-color: rgb(215, 252, 240);
        margin: 0;
        padding: 200px;
      }

      .parent {
        border: 5px solid #000;
        width: 250px;
        height: 250px;
        box-sizing: border-box;
        position: relative;
        margin-top: 1rem;
      }

      .container {
        background-color: #09f;
        width: 100px;
        height: 100px;
        position: absolute;
        /* top: 0;
        bottom: 0;
        right: 0;
        left: 0; */
        inset: 0;
        margin: auto;
        z-index: 1;
      }

      .containerI {
        background-color: rgb(132, 184, 219);
        width: 100px;
        height: 100px;
        position: fixed;
        top: 0;
        right: 0;
      }

      .containerIII {
        background-color: rgb(118, 209, 195);
        width: 100px;
        height: 100px;
        position: sticky;
        top: 0;
        right: 0;
      }

      .containerIV {
        background-color: rgb(143, 153, 164);
        width: 100px;
        height: 100px;
        position: fixed;
        z-index: 2;
      }

      div {
        border: 1px solid;
        opacity: 0.9;
        width: 200px;
        height: 200px;
        margin-top: -100px;
        box-shadow: 0 0 5px #000000dd;
        position: relative;
      }

      div:first-child {
        background-color: yellow;
        z-index: 1;
      }

      div:nth-child(2) {
        background-color: #09f;
        z-index: 2;
      }

      div:last-child {
        background-color: red;
        z-index: 3;
      }
    </style>
  </head>
